[project]
name = "quant_prop_lab"
version = "0.1.0"
description = "Autonomous systematic-trading research engine for prop-firm evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "numba>=0.60", "pyarrow>=15", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
